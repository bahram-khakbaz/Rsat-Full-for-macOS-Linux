services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rsat_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Unprivileged by default. For Vault Agent deliveries, set this to the UID
    # that owns the delivered files (see docs/VAULT_AGENT.md).
    user: "${RSAT_BACKEND_UID:-10001}:${RSAT_BACKEND_GID:-10001}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_MODE: ${DEMO_MODE:-true}
      WORKER_URL: ${WORKER_URL:-}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      ALLOW_INSECURE_WORKER: ${ALLOW_INSECURE_WORKER:-false}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build: ./frontend
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rsat_db:

# Avoid overlaps with corporate AD networks in 172.16.0.0/12.
networks:
  default:
    ipam:
      config:
        - subnet: ${RSAT_DOCKER_SUBNET:-192.168.247.0/24}
