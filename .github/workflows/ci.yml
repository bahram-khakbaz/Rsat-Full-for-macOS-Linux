name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libkrb5-dev krb5-user python3-samba
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint and formatting
        run: |
          ruff check backend windows-agent
          ruff format --check backend windows-agent
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: PYTHONPATH=backend /usr/bin/python3 backend/tests/samba_rpc_check.py
      - run: python3 macos/tests/test_launcher.py
      - run: python -m compileall -q backend/app windows-agent/app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate gMSA task definition without registering it
        shell: powershell
        run: .\windows-agent\tests\Test-GmsaTask.ps1
      - name: Test unattended pairing file lifecycle
        shell: pwsh
        run: python windows-agent/tests/test_unattended.py
      - name: Worker unit tests (pairing, TLS, validation, paging, DNS, PowerShell syntax)
        working-directory: windows-agent
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt httpx==0.28.1 pytest==8.3.4
          python -m pytest -q -p no:cacheprovider tests
      - name: Parse Windows worker scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path windows-agent -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-macos-app.py
      - run: python3 macos/tests/test_launcher.py

  compose:
    # Builds both images and proves the stack starts healthy as unprivileged
    # containers with generated secrets, hardening headers and cookie sign-in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to start with example secrets
        run: |
          cp .env.example .env
          docker compose build
          if docker compose up -d --wait --wait-timeout 120; then
            echo "Stack started with placeholder secrets" >&2
            exit 1
          fi
          docker compose logs backend | grep -q "Insecure configuration"
          docker compose down --volumes
          rm .env
      - name: Start with generated secrets
        run: |
          bash scripts/macos-bootstrap.sh
          docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/api/health | tee health.json
          grep -q '"status":"ok"' health.json
          headers=$(curl --fail --silent --head http://localhost:8080/)
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"
          password=$(grep '^ADMIN_PASSWORD=' .env | cut -d= -f2-)
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie-jar jar.txt --header 'Content-Type: application/json' \
            --data "{\"username\":\"admin\",\"password\":\"$password\"}" \
            http://localhost:8080/api/auth/login)
          test "$code" = "200"
          grep -q 'HttpOnly' jar.txt
          curl --fail --silent --cookie jar.txt http://localhost:8080/api/auth/me | grep -q '"role":"admin"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/auth/me)" = "401"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
