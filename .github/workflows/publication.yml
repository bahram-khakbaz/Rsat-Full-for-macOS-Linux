name: Publication hygiene
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked files and historical paths
        run: python3 scripts/check-publication.py --history
      - name: Verify guard behavior in a disposable repository
        run: python3 scripts/tests/test_publication.py
      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan reachable history for secrets with redacted output
        run: gitleaks git --redact --no-banner --log-opts=--all .
